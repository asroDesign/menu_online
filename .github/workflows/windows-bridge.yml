name: Windows hardware bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-bridge/**"
      - ".github/workflows/windows-bridge.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-bridge/src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Prepare WinSpool import library name for Rust linker
        shell: pwsh
        run: |
          $sdkLib = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Filter WinSpool.lib -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\um\\x64\\WinSpool\.lib$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $sdkLib) {
            throw "Windows SDK x64 WinSpool.lib was not found; cannot prepare the serialport linker compatibility alias."
          }

          $compatDir = Join-Path $env:RUNNER_TEMP "winspool-link-compat"
          New-Item -ItemType Directory -Force -Path $compatDir | Out-Null
          Copy-Item $sdkLib.FullName (Join-Path $compatDir "winspool.drv.lib") -Force
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$compatDir;$env:LIB"
          Write-Host "Using Windows SDK import library $($sdkLib.FullName) as winspool.drv.lib"

      - name: Build NSIS installer
        working-directory: windows-bridge/src-tauri
        run: cargo tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: digital-menu-bridge-windows-x64
          path: windows-bridge/src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-installer:
    needs: build-windows-installer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: digital-menu-bridge-windows-x64
          path: dist

      - name: Publish stable direct download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$installer"
          cp "$installer" dist/MenuPeak-Bridge-Setup-x64.exe
          if ! gh release view windows-bridge-latest --repo "$GH_REPOSITORY" >/dev/null 2>&1; then
            gh release create windows-bridge-latest \
              --repo "$GH_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "MenuPeak Windows Hardware Bridge" \
              --notes "Latest stable Windows installer for the MenuPeak local hardware bridge. This release asset is replaced after each successful build on main." \
              --latest=false
          fi
          gh release upload windows-bridge-latest dist/MenuPeak-Bridge-Setup-x64.exe \
            --repo "$GH_REPOSITORY" \
            --clobber
